---
# Local-development mirror of the "f5_inventory" that
# aap_config/04_inventory.yml creates in Ansible Automation Platform.
#
# The shape is intentional and is explained in the README:
#
#   localhost  - where every playbook STARTS. The first play runs here with
#                ansible_connection: local and turns the credential values
#                into a real target.
#   f5os       - where every playbook DOES ITS WORK. Empty on disk; hosts are
#                added at run time by the f5os_target role. All of the shared
#                httpapi connection settings live in
#                inventory/group_vars/f5os.yml, so a host only has to join
#                this group to be reachable.
all:
  hosts:
    localhost:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"

  children:
    f5os:
      # No static hosts. See inventory/group_vars/f5os.yml for this group's
      # variables - that path is load-bearing, see the note in that file.
      #
      # If you would rather target a permanent appliance instead of using the
      # credential, just add it here - it inherits the whole connection profile
      # from the group vars and needs nothing else but a password:
      #
      # hosts:
      #   rseries01.example.com:
      #     ansible_user: admin
      #     ansible_httpapi_password: "{{ vault_rseries01_password }}"
      hosts: {}
