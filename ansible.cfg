[defaults]
inventory = inventory/hosts.yml
roles_path = roles
host_key_checking = False
interpreter_python = auto_silent

# Readable task output. Note this is NOT "stdout_callback = yaml" - that
# callback lived in community.general and was removed in version 12. The
# built-in default callback renders YAML natively via this option instead.
callback_result_format = yaml
deprecation_warnings = False
retry_files_enabled = False

# F5OS image import/install and tenant deploys are long-running RESTCONF calls.
# The defaults (30s) will time out on anything but the smallest change.
[persistent_connection]
command_timeout = 1800
connect_timeout = 1800
