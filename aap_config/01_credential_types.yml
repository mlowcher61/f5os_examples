---
# The custom credential type for F5OS / rSeries appliances.
#
# WHY A CUSTOM TYPE AND NOT A VAULTED FILE
# Everything sensitive stays inside AAP: the password is write-only in the API,
# masked in job output, and governed by AAP's RBAC. Nothing about a specific
# appliance ever reaches git. Pointing a job template at a different appliance
# becomes a credential swap, not a code change.
#
# WHY extra_vars AND NOT env INJECTORS
# The f5networks.f5os modules read their connection from the httpapi plugin,
# and the httpapi plugin is configured from Ansible *variables*
# (ansible_host, ansible_user, ansible_httpapi_password). The f5os_target role
# needs these as real variables so it can hand them to add_host, so they are
# injected as extra vars. Extra vars beat role defaults, which is exactly the
# precedence we want.
#
# The {% raw %} blocks matter: the injector templates are rendered by AAP at
# job launch, not by this playbook. Without raw, Ansible would try to resolve
# them here and fail.
- name: Create the F5OS custom credential type
  hosts: localhost
  connection: local
  gather_facts: false

  module_defaults:
    group/ansible.controller.controller:
      controller_host: "{{ controller_host }}"
      controller_username: "{{ controller_username }}"
      controller_password: "{{ controller_password }}"
      validate_certs: "{{ aap_validate_certs | default(false) }}"

  tasks:
    - name: F5OS / rSeries credential type
      ansible.controller.credential_type:
        name: "{{ f5os_credential_type_name | default('f5os_rseries') }}"
        description: >-
          Connection details for an F5OS platform (rSeries appliance or VELOS
          partition), consumed by the f5os_target role in the f5os_examples repo.
        kind: net
        inputs:
          fields:
            - id: f5os_host
              type: string
              label: F5OS management address
              help_text: Hostname or IP of the rSeries appliance or VELOS partition.
            - id: f5os_user
              type: string
              label: Username
              help_text: An F5OS account with a role sufficient for the tasks you run.
            - id: f5os_password
              type: string
              label: Password
              secret: true
            - id: f5os_port
              type: string
              label: API port
              help_text: 8888 for RESTCONF (default), 443 for OpenAPI.
              default: "8888"
            - id: f5os_validate_certs
              type: boolean
              label: Validate TLS certificate
              help_text: >-
                Leave unchecked while the appliance still has its self-signed
                certificate. Enable after installing a trusted certificate.
          required:
            - f5os_host
            - f5os_user
            - f5os_password
        injectors:
          extra_vars:
            f5os_host: "{% raw %}{{ f5os_host }}{% endraw %}"
            f5os_user: "{% raw %}{{ f5os_user }}{% endraw %}"
            f5os_password: "{% raw %}{{ f5os_password }}{% endraw %}"
            f5os_port: "{% raw %}{{ f5os_port | default('8888') }}{% endraw %}"
            f5os_validate_certs: "{% raw %}{{ f5os_validate_certs | default(false) }}{% endraw %}"
        state: present
