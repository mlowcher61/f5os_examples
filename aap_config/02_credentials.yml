---
# The credential instance itself - one per appliance.
#
# The values come from aap_config/vars/main.yml, which is gitignored. If you
# would rather not put the password on disk even temporarily, create the
# credential with a placeholder here and set the real password once in the AAP
# UI: AAP never returns a secret through the API, so a later re-run of this
# playbook will not overwrite it unless you supply a new one.
- name: Create the F5OS credentials
  hosts: localhost
  connection: local
  gather_facts: false

  module_defaults:
    group/ansible.controller.controller:
      controller_host: "{{ controller_host }}"
      controller_username: "{{ controller_username }}"
      controller_password: "{{ controller_password }}"
      validate_certs: "{{ aap_validate_certs | default(false) }}"

  tasks:
    - name: F5OS rSeries appliance credential
      ansible.controller.credential:
        name: "{{ f5os_credential_name | default('F5OS rSeries') }}"
        description: "F5OS management access for {{ f5os_host }}"
        organization: "{{ aap_organization }}"
        credential_type: "{{ f5os_credential_type_name | default('f5os_rseries') }}"
        inputs:
          f5os_host: "{{ f5os_host }}"
          f5os_user: "{{ f5os_user }}"
          f5os_password: "{{ f5os_password }}"
          f5os_port: "{{ f5os_port | default('8888') }}"
          f5os_validate_certs: "{{ f5os_validate_certs | default(false) }}"
        state: present
      no_log: true

    # Only needed if you set the project to a PRIVATE git repository.
    - name: Source control credential for a private project repo
      ansible.controller.credential:
        name: "{{ project_scm_credential | default('F5OS SCM') }}"
        organization: "{{ aap_organization }}"
        credential_type: "Source Control"
        inputs:
          username: "{{ scm_username | default('') }}"
          password: "{{ scm_token }}"
        state: present
      no_log: true
      when: scm_token is defined and scm_token | length > 0
